[workspace]
resolver = "3"
members = ["crates/*"]

# Shared metadata — member crates inherit these with `field.workspace = true`,
# so version/edition are bumped in one place instead of seven.
[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/danczw/echo"

# Shared lint config — member crates opt in with `[lints] workspace = true`.
# `echo-sandbox` deliberately does NOT opt in: it is the only crate allowed to
# contain `unsafe` code or spawn subprocesses directly.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The actual method list lives in clippy.toml at the workspace root.
disallowed_methods = "deny"
